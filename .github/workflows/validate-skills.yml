name: validate-skills

# CI 只跑本地校验：静态校验、mock 层测试、规范校验。
# 真实禅道 MCP 的端到端测试需要内网环境与明确授权，不在 CI 中运行。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 静态校验（元数据 / 引用 / 硬约束 / 敏感信息）
        run: node tests/validate-skills.mjs

      - name: 模拟层测试（mock MCP）
        run: node --test tests/e2e-mock.mjs

      - name: 打包与随包脚本测试
        run: node --test tests/package.mjs

      - name: Agent Skills 规范校验
        run: npx --yes skills-ref validate skills/rh-product-feedback
