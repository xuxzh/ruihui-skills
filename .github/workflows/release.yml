name: release

# 生成 GitHub Release，正文取自 CHANGELOG.md 里对应版本的段落（scripts/release-notes.mjs 抽取）。
# - 推送 v<技能版本> 标签：处理这一个标签。
# - 手动触发（workflow_dispatch）：给某个标签补建，或不填标签把所有还没有 Release 的 v* 标签从旧到新补齐
#   （工作流文件取自触发它的提交，补录的历史标签指向旧提交，只能走手动触发）。
# 每个标签都校验「标签 = 标签提交里的 rh-version = 更新日志段落」，标签提交必须在 main 上；更新日志从 main 读。
# 已有 Release 的标签跳过，所以可以重跑。发版步骤见 README 的「发版」。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要生成 Release 的标签（如 v0.14.0）；留空则补齐所有还没有 Release 的 v* 标签
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 定出要处理的标签
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.ref_name }}
          INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            tags="$PUSHED"
          elif [ -n "$INPUT" ]; then
            tags="$INPUT"
          else
            tags=""
            for tag in $(git tag --list 'v*' --sort=v:refname); do
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || tags="$tags $tag"
            done
            tags="${tags# }"
          fi
          echo "list=$tags" >> "$GITHUB_OUTPUT"
          echo "要处理的标签：${tags:-（无）}"

      - name: 逐个校验并生成 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            version="${tag#v}"
            git merge-base --is-ancestor "$tag" origin/main || { echo "::error::标签 $tag 指向的提交不在 main 上"; exit 1; }
            git show "$tag:skills/rh-product-feedback/SKILL.md" > "$RUNNER_TEMP/SKILL.md"
            node scripts/release-notes.mjs --check "$version" --skill-file "$RUNNER_TEMP/SKILL.md"
            # 提交里带更新日志的标签（发版机制建立之后的版本）在该提交上再跑一遍静态校验；补录的历史版本没有这个文件。
            if git cat-file -e "$tag:CHANGELOG.md" 2>/dev/null; then
              git checkout --quiet --detach "$tag"
              node tests/validate-skills.mjs
              git checkout --quiet main
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "跳过 $tag：已有 Release"
              continue
            fi
            node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          done
